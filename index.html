    --bg:#0e211a; --surface:#16332a; --fg:#eef3ea; --muted:#a3b9ac; --line:#2b4a3f;
    --accent:#f2c94c; --accent-fg:#2b2200; --soft:#1d3d33;
    --board:#0a1a14; --board-fg:#f4f6ef;
    --good:#6fd39a; --bad:#ff9a8e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e211a; --surface:#16332a; --fg:#eef3ea; --muted:#a3b9ac; --line:#2b4a3f;
  --accent:#f2c94c; --accent-fg:#2b2200; --soft:#1d3d33;
  --board:#0a1a14; --board-fg:#f4f6ef;
  --good:#6fd39a; --bad:#ff9a8e; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.6;
  padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.shell{max-width:1040px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand{font-family:var(--font-display); font-size:28px; line-height:1.2; letter-spacing:.01em; margin:0}
.brand small{display:block; font-family:var(--font-body); font-size:12px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase}
.tabs{display:flex; gap:4px; background:var(--soft); padding:4px; border-radius:10px}
.tabs button{border:0; background:transparent; color:var(--fg); padding:6px 14px; border-radius:7px; font:inherit; font-weight:500; cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.15)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px}
.stack{display:flex; flex-direction:column; gap:14px}
.host{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:820px){.host{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex; flex-direction:column; gap:6px; font-weight:500; font-size:13px; color:var(--muted)}
input[type=text], input[type=password], textarea, select{
  font:inherit; font-size:16px; color:var(--fg); background:var(--bg); border:1.5px solid var(--line);
  border-radius:10px; padding:10px 12px; width:100%; min-width:0}
textarea{resize:vertical; min-height:76px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--soft); padding:4px; border-radius:10px}
.seg input{position:absolute; opacity:0; pointer-events:none}
.seg label{text-align:center; padding:8px 6px; border-radius:7px; cursor:pointer; font-weight:500}
.seg input:checked + label{background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seg input:focus-visible + label{outline:3px solid var(--accent)}
.btns{display:flex; gap:8px; flex-wrap:wrap}
.btn{border:1.5px solid var(--line); background:var(--surface); color:var(--fg); padding:10px 16px; border-radius:10px; font-weight:700; font-size:15px; cursor:pointer}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.status{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted)}
.pill{display:inline-block; padding:1px 10px; border-radius:99px; font-weight:700; font-size:12px; background:var(--soft); color:var(--fg)}
.pill.open{background:var(--accent); color:var(--accent-fg)}
.chalk{
  background:var(--board); color:var(--board-fg); border-radius:14px; padding:22px 20px;
  border:3px solid color-mix(in srgb, var(--board-fg) 28%, var(--board));
  text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center}
.chalk .k{font-size:12px; letter-spacing:.14em; color:var(--chalk); font-weight:700}
.chalk .q{font-family:var(--font-display); font-size:clamp(28px,6vw,52px); line-height:1.3; word-break:keep-all; overflow-wrap:anywhere; user-select:none; -webkit-user-select:none}
.chalk .q.long{font-size:clamp(20px,3.6vw,30px); line-height:1.55}
.chalk .h{font-size:14px; opacity:.85}
.boardhead{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap}
.boardhead h2{margin:0; font-family:var(--font-display); font-size:22px; font-weight:400}
.rows{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.row{display:grid; grid-template-columns:46px minmax(0,1fr) auto; gap:4px 12px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--bg)}
.row .rk{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-family:var(--font-display); font-size:20px; background:var(--soft); color:var(--muted)}
.row.r1 .rk{background:var(--gold); color:var(--medal-fg)}
.row.r2 .rk{background:var(--silver); color:var(--medal-fg)}
.row.r3 .rk{background:var(--bronze); color:var(--medal-fg)}
.row.r1{border-color:var(--gold); border-width:2px}
.row .who{min-width:0}
.row .nick{font-weight:700; font-size:17px; overflow-wrap:anywhere}
.row .txt{color:var(--muted); overflow-wrap:anywhere; word-break:keep-all}
.row .tm{font-variant-numeric:tabular-nums; font-weight:700; text-align:right; font-size:17px}
.row .tm small{display:block; font-weight:400; color:var(--muted); font-size:12px}
.row .ctl{grid-column:2 / 4; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.chip{font-size:12px; font-weight:700; padding:1px 9px; border-radius:99px; border:1.5px solid currentColor}
.chip.ok{color:var(--good)} .chip.no{color:var(--bad)} .chip.na{color:var(--muted)}
.mini{border:1.5px solid var(--line); background:var(--surface); color:var(--fg); border-radius:8px; padding:2px 10px; font-weight:700; cursor:pointer; font-size:13px}
.mini[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.empty{padding:26px 8px; text-align:center; color:var(--muted)}
.empty b{display:block; color:var(--fg); font-size:16px; margin-bottom:4px}
.play{max-width:560px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:16px}
.big{font-family:var(--font-display); font-size:24px; margin:0; font-weight:400}
.msg{padding:12px 14px; border-radius:10px; background:var(--soft)}
.msg.bad{color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--surface)); font-weight:500}
.msg.good{color:var(--good); background:color-mix(in srgb, var(--good) 12%, var(--surface)); font-weight:700}
.podium{display:flex; flex-direction:column; gap:8px}
.note{font-size:13px; color:var(--muted)}
.chk{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.chk input{width:18px; height:18px; accent-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.chalk{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}}

.ql{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.qi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.qi.cur{border-color:var(--accent);border-width:2px}
.qi.done{opacity:.6}
.qn{font-family:var(--font-display);font-size:20px;min-width:26px;text-align:center}
.qt{min-width:0;overflow-wrap:anywhere}
.qt small{display:block;color:var(--muted)}
.qc{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{min-height:48px}
.play input[type=text]{font-size:18px;padding:14px}
.play .chalk .q{font-size:clamp(34px,11vw,60px)}
.play .chalk .q.long{font-size:clamp(22px,6.4vw,34px)}
.dock{display:none}
@media (max-width:820px){
  .prog{display:none}
  .host{padding-bottom:88px}
  .host.live > section[aria-label="순위판"]{order:-1}
  .dock{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .dock .btn{padding:10px 6px;font-size:15px;min-width:0}
}
.brandrow{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:56px;height:56px;flex:none;border-radius:50%;background:#fff;object-fit:contain;box-shadow:0 0 0 1px var(--line)}
@media (max-width:480px){.logo{width:48px;height:48px}}
/* 큰 글씨 (어르신용) */
body{font-size:17px}
label.f{font-size:15px}
.note,.status,.chk{font-size:15px}
.btn{font-size:18px;min-height:52px}
.big{font-size:27px}
.brand small{font-size:14px}
.tabs button{font-size:16px;padding:8px 14px}
.chalk .k{font-size:14px}
.chalk .h{font-size:17px}
.msg{font-size:17px}
.play .msg.good{font-size:19px}
.play input[type=text]{font-size:21px;padding:16px}
.row .nick{font-size:19px}
.row .tm{font-size:19px}
.row .tm small,.chip,.mini{font-size:14px}
.qt{font-size:17px}
.qt small{font-size:14px}
@media (max-width:820px){ .dock .btn{font-size:16px} }
.brand{word-break:keep-all;text-wrap:balance}
@media (max-width:480px){ .brand{font-size:24px} }
</style>
</head>

      set: (d) => setDoc(r, d),
      update: (d) => setDoc(r, d, { merge: true }),
      delete: () => deleteDoc(r),
      onSnapshot: (next, err) => onSnapshot(r, (s) => next(shape(s)), err)
    };
  },
  collection(path){
    const c = collection(fs, path);
    return { onSnapshot: (next, err) => onSnapshot(c, (q) => next({ docs: q.docs.map(shape) }), err) };
  }
};

  function rankedRows(k){

    }
    if(sub){
      var closedNote = game.status === 'open' ? '진행자가 마감하면 순위를 발표해요.' : '마감됐어요. 다음 문제를 기다려 주세요.';
      st.innerHTML = '<div class="stack">' + intro + board + '<div class="msg good">전송 완료! ' + fmt(sub.ms || 0) + ' 걸렸어요.</div><div class="card"><div class="note">내가 보낸 답</div><div style="font-size:18px;font-weight:700;overflow-wrap:anywhere">' + esc(sub.text) + '</div></div><p class="note" style="margin:0">' + closedNote + '</p>' + podium() + '</div>';
      return;
    }
    st.innerHTML = '<div class="stack">' + intro + '<div class="card empty"><b>마감됐어요</b>이번 문제는 제출하지 못했어요.</div>' + podium() + '</div>';
  }
  function podium(){
    if(!results || !game || results.round !== game.round || !results.rows || !results.rows.length) return '';
    var h = '<div class="card"><h3 class="big" style="margin-bottom:10px">이번 문제 순위</h3><div class="podium">';
    results.rows.forEach(function(r){
      h += '<div class="row r' + r.rank + '" style="grid-template-columns:46px minmax(0,1fr) auto"><div class="rk">' + r.rank + '</div><div class="who"><div class="nick">' + esc(r.nick) + '</div><div class="txt">' + esc(r.text) + '</div></div><div class="tm">' + fmt(r.ms) + '</div></div>';
    });
    return h + '</div></div>';
  }
  function joinAs(nick){
    me.nick = nick; lsSet('quiz-nick', nick);
    var ref = db.doc('subs/' + uid);
    ref.get().then(function(s){ return s.exists ? ref.update({ nick: nick }) : ref.set({ nick: nick, joinedAt: Date.now(), answers: {} }); })
      .then(function(){ me.joined = true; renderStage(true); })
      .catch(function(){ canWrite = false; renderStage(true); });
  }
  function submitAnswer(){
    var inp = $('#a-in'); var text = norm(inp.value); if(!text){ inp.focus(); return; }
    var ms = Math.max(0, Math.round(performance.now() - shownAt));
    tries++;
    if(game.mode === 'typing' && norm(game.prompt) !== text){
      var a = norm(game.prompt), i = 0; while(i < a.length && i < text.length && a[i] === text[i]) i++;
      $('#fb').innerHTML = '<div class="msg bad" role="alert">' + (i + 1) + '번째 글자부터 달라요. 고쳐서 다시 전송하세요.</div>';
      inp.focus(); return;
    }
    var patch = { nick: me.nick, answers: {} }; patch.answers[curKey()] = { text: text, ms: ms, tries: tries, ts: Date.now() };
    $('#ans button[type=submit]').disabled = true;
    db.doc('subs/' + uid).update(patch).catch(function(){
      $('#fb').innerHTML = '<div class="msg bad" role="alert">전송하지 못했어요. 잠시 후 다시 눌러 주세요.</div>';
      $('#ans button[type=submit]').disabled = false;
    });
  }

  /* ---------------- 연결 ---------------- */
  function switchView(v){
    view = v;
    document.querySelectorAll('#tabs button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === v)); });
    if(v === 'host') buildHost(); else buildPlay();
  }
  function onGame(){
    if(game && game.status === 'open' && shownFor !== game.openedAt){ shownFor = game.openedAt; shownAt = performance.now(); tries = 0; }
    if(view === 'host') hostRefresh(); else renderStage();
  }

  function showErr(title, body){ main.innerHTML = '<div class="card empty"><b>' + esc(title) + '</b>' + esc(body) + '</div>'; }
  function fail(e){ if(window.console) console.error(e); }

  var hostSubscribed = false;
  function enterHost(){
    isHost = true;
    $('#hostlink').hidden = true;
    $('#tabs').hidden = false;
    if(!hostSubscribed){
      hostSubscribed = true;
      db.doc('game/rounds').onSnapshot(function(s){ rounds = s.exists ? s.data() : {}; hostRefresh(); }, fail);
      db.doc('game/marks').onSnapshot(function(s){ marks = s.exists ? s.data() : {}; hostRefresh(); }, fail);
      db.doc('secret/answers').onSnapshot(function(s){ answers = s.exists ? s.data() : {}; hostRefresh(); }, fail);
      db.doc('secret/plan').onSnapshot(function(s){ var d = s.exists ? s.data() : null; plan = d && d.items ? d.items : []; hostRefresh(); }, fail);
      db.collection('subs').onSnapshot(function(q){ subs = q.docs.map(function(d){ var x = d.data() || {}; x.id = d.id; return x; }); hostRefresh(); }, fail);
      $('#tabs').addEventListener('click', function(e){ var b = e.target.closest('button'); if(b) switchView(b.dataset.v); });
    }
    switchView('host');
  }

  function showHostLogin(){
    view = 'login';
    main.innerHTML = '<form class="card stack" id="hl" style="max-width:420px;margin:0 auto"><h2 class="big">진행자 입장</h2>' +
      '<label class="f" for="hpw"><span>진행자 비밀번호</span><input type="password" id="hpw" autocomplete="off"></label>' +
      '<div id="hfb"></div><div class="btns"><button class="btn primary" type="submit">입장</button><button class="btn" type="button" id="hback">돌아가기</button></div></form>';
    $('#hpw').focus();
    $('#hback').addEventListener('click', function(){ view = 'play'; buildPlay(); });
    $('#hl').addEventListener('submit', function(e){
      e.preventDefault();
      var v = $('#hpw').value; if(!v) return;
      db.doc('hosts/' + uid).set({ pw: v }).then(enterHost).catch(function(){
        $('#hfb').innerHTML = '<div class="msg bad" role="alert">비밀번호가 맞지 않아요.</div>';
      });
    });
  }

  function start(){
    $('#hostlink').addEventListener('click', showHostLogin);
    signInAnonymously(auth).then(function(c){
      uid = c.user.uid;
      return db.doc('hosts/' + uid).get().catch(function(){ return { exists: false }; });
    }).then(function(h){
      db.doc('game/state').onSnapshot(function(s){ game = s.exists ? s.data() : null; onGame(); }, fail);
      db.doc('game/results').onSnapshot(function(s){ results = s.exists ? s.data() : null; if(view === 'host') renderStatus(); else renderStage(); }, fail);
      db.doc('subs/' + uid).onSnapshot(function(s){ mySub = s.exists ? s.data() : null; renderStage(); }, fail);
      if(h.exists){ enterHost(); }
      else {
        $('#hostlink').hidden = false;
        view = 'play'; buildPlay();
        if(me.nick) joinAs(me.nick);
      }
    }).catch(function(e){
      var c = e && e.code || '';
      if(c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation') showErr('익명 로그인이 꺼져 있어요', 'Firebase 콘솔 Authentication에서 익명 로그인을 켜 주세요.');
      else showErr('연결하지 못했어요', '인터넷 연결을 확인하고 새로고침해 주세요. 계속되면 진행자에게 알려 주세요.');
      fail(e);
    });
  }
  start();
})();
</script>
</body>
</html>
