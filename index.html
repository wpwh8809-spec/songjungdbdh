<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>송정 퀴즈왕 선발대회</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 화면 두 얼굴. 진행자는 왼쪽 조작판 + 오른쪽 순위판, 참가자는 칠판 한 장과 입력칸. */
:root{
  color-scheme:light;
  --bg:#f1f4ee; --surface:#ffffff; --fg:#14291f; --muted:#52695d; --line:#d3ddd3;
  --accent:#1f6b4f; --accent-fg:#ffffff; --soft:#e4ece3;
  --board:#17402f; --board-fg:#f4f6ef; --chalk:#f2c94c;
  --good:#1d7a45; --bad:#b3372c;
  --gold:#e3b023; --silver:#b4bdc5; --bronze:#c98a57; --medal-fg:#201a05;
  --font-display:'Do Hyeon','Noto Sans KR',sans-serif;
  --font-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e211a; --surface:#16332a; --fg:#eef3ea; --muted:#a3b9ac; --line:#2b4a3f;
    --accent:#f2c94c; --accent-fg:#2b2200; --soft:#1d3d33;
    --board:#0a1a14; --board-fg:#f4f6ef;
    --good:#6fd39a; --bad:#ff9a8e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e211a; --surface:#16332a; --fg:#eef3ea; --muted:#a3b9ac; --line:#2b4a3f;
  --accent:#f2c94c; --accent-fg:#2b2200; --soft:#1d3d33;
  --board:#0a1a14; --board-fg:#f4f6ef;
  --good:#6fd39a; --bad:#ff9a8e; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.6;
  padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.shell{max-width:1040px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand{font-family:var(--font-display); font-size:28px; line-height:1.2; letter-spacing:.01em; margin:0}
.brand small{display:block; font-family:var(--font-body); font-size:12px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase}
.tabs{display:flex; gap:4px; background:var(--soft); padding:4px; border-radius:10px}
.tabs button{border:0; background:transparent; color:var(--fg); padding:6px 14px; border-radius:7px; font:inherit; font-weight:500; cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.15)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px}
.stack{display:flex; flex-direction:column; gap:14px}
.host{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:820px){.host{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex; flex-direction:column; gap:6px; font-weight:500; font-size:13px; color:var(--muted)}
input[type=text], input[type=password], textarea, select{
  font:inherit; font-size:16px; color:var(--fg); background:var(--bg); border:1.5px solid var(--line);
  border-radius:10px; padding:10px 12px; width:100%; min-width:0}
textarea{resize:vertical; min-height:76px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--soft); padding:4px; border-radius:10px}
.seg input{position:absolute; opacity:0; pointer-events:none}
.seg label{text-align:center; padding:8px 6px; border-radius:7px; cursor:pointer; font-weight:500}
.seg input:checked + label{background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seg input:focus-visible + label{outline:3px solid var(--accent)}
.btns{display:flex; gap:8px; flex-wrap:wrap}
.btn{border:1.5px solid var(--line); background:var(--surface); color:var(--fg); padding:10px 16px; border-radius:10px; font-weight:700; font-size:15px; cursor:pointer}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.status{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted)}
.pill{display:inline-block; padding:1px 10px; border-radius:99px; font-weight:700; font-size:12px; background:var(--soft); color:var(--fg)}
.pill.open{background:var(--accent); color:var(--accent-fg)}
.chalk{
  background:var(--board); color:var(--board-fg); border-radius:14px; padding:22px 20px;
  border:3px solid color-mix(in srgb, var(--board-fg) 28%, var(--board));
  text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center}
.chalk .k{font-size:12px; letter-spacing:.14em; color:var(--chalk); font-weight:700}
.chalk .q{font-family:var(--font-display); font-size:clamp(28px,6vw,52px); line-height:1.3; word-break:keep-all; overflow-wrap:anywhere; user-select:none; -webkit-user-select:none}
.chalk .q.long{font-size:clamp(20px,3.6vw,30px); line-height:1.55}
.chalk .h{font-size:14px; opacity:.85}
.boardhead{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap}
.boardhead h2{margin:0; font-family:var(--font-display); font-size:22px; font-weight:400}
.rows{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.row{display:grid; grid-template-columns:46px minmax(0,1fr) auto; gap:4px 12px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--bg)}
.row .rk{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-family:var(--font-display); font-size:20px; background:var(--soft); color:var(--muted)}
.row.r1 .rk{background:var(--gold); color:var(--medal-fg)}
.row.r2 .rk{background:var(--silver); color:var(--medal-fg)}
.row.r3 .rk{background:var(--bronze); color:var(--medal-fg)}
.row.r1{border-color:var(--gold); border-width:2px}
.row .who{min-width:0}
.row .nick{font-weight:700; font-size:17px; overflow-wrap:anywhere}
.row .txt{color:var(--muted); overflow-wrap:anywhere; word-break:keep-all}
.row .tm{font-variant-numeric:tabular-nums; font-weight:700; text-align:right; font-size:17px}
.row .tm small{display:block; font-weight:400; color:var(--muted); font-size:12px}
.row .ctl{grid-column:2 / 4; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.chip{font-size:12px; font-weight:700; padding:1px 9px; border-radius:99px; border:1.5px solid currentColor}
.chip.ok{color:var(--good)} .chip.no{color:var(--bad)} .chip.na{color:var(--muted)}
.mini{border:1.5px solid var(--line); background:var(--surface); color:var(--fg); border-radius:8px; padding:2px 10px; font-weight:700; cursor:pointer; font-size:13px}
.mini[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.empty{padding:26px 8px; text-align:center; color:var(--muted)}
.empty b{display:block; color:var(--fg); font-size:16px; margin-bottom:4px}
.play{max-width:560px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:16px}
.big{font-family:var(--font-display); font-size:24px; margin:0; font-weight:400}
.msg{padding:12px 14px; border-radius:10px; background:var(--soft)}
.msg.bad{color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--surface)); font-weight:500}
.msg.good{color:var(--good); background:color-mix(in srgb, var(--good) 12%, var(--surface)); font-weight:700}
.podium{display:flex; flex-direction:column; gap:8px}
.note{font-size:13px; color:var(--muted)}
.chk{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.chk input{width:18px; height:18px; accent-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.chalk{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}}

.ql{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.qi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.qi.cur{border-color:var(--accent);border-width:2px}
.qi.done{opacity:.6}
.qn{font-family:var(--font-display);font-size:20px;min-width:26px;text-align:center}
.qt{min-width:0;overflow-wrap:anywhere}
.qt small{display:block;color:var(--muted)}
.qc{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <h1 class="brand"><small>송정초등학교 등반대회</small>송정 퀴즈왕 선발대회</h1>
    <button type="button" class="btn" id="hostlink" hidden>진행자 입장</button>
    <div class="tabs" id="tabs" hidden>
      <button type="button" data-v="host" aria-pressed="true">진행자</button>
      <button type="button" data-v="play" aria-pressed="false">참가자 화면</button>
    </div>
  </header>
  <main id="main"><div class="card empty"><b>불러오는 중이에요</b>잠시만 기다려 주세요.</div></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, doc, collection, getDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB_D8KZ6OB2m-dqTo9eRW-2ECRHKouJpjo",
  authDomain: "songjungdbdh.firebaseapp.com",
  projectId: "songjungdbdh",
  storageBucket: "songjungdbdh.firebasestorage.app",
  messagingSenderId: "1020245270090",
  appId: "1:1020245270090:web:dc05e58275bbe8be6090b3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const fs = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
const shape = (s) => ({ id: s.id, exists: s.exists(), data: () => s.data() });
const store = {
  doc(path){
    const r = doc(fs, path);
    return {
      get: () => getDoc(r).then(shape),
      set: (d) => setDoc(r, d),
      update: (d) => setDoc(r, d, { merge: true }),
      delete: () => deleteDoc(r),
      onSnapshot: (next, err) => onSnapshot(r, (s) => next(shape(s)), err)
    };
  },
  collection(path){
    const c = collection(fs, path);
    return { onSnapshot: (next, err) => onSnapshot(c, (q) => next({ docs: q.docs.map(shape) }), err) };
  }
};

(function(){
  var $ = function(s, el){ return (el||document).querySelector(s); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var norm = function(s){ return (s||'').normalize('NFC').replace(/\s+/g,' ').trim(); };
  var loose = function(s){ return norm(s).toLowerCase().replace(/[\s.,!?'"“”‘’~·…\-—()]/g,''); };
  var fmt = function(ms){ return (ms/1000).toFixed(2) + '초'; };
  var lsGet = function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } };
  var lsSet = function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} };
  var main = $('#main');

  var db = store, uid = null, isHost = false, canWrite = true;
  var view = 'host';
  var game = null, rounds = {}, marks = {}, results = null, answers = {}, subs = [], mySub = null, plan = [];
  var selRound = null, hideOn = true;
  var shownFor = null, shownAt = 0, tries = 0, me = { nick: lsGet('quiz-nick') || '', joined: false };

  function upsert(ref, data){
    return ref.get().then(function(s){ return s.exists ? ref.update(data) : ref.set(data); });
  }
  function rk(n){ return 'r' + n; }
  function curKey(){ return game && game.round ? rk(game.round) : null; }
  function metaFor(k){
    if(rounds[k]) return rounds[k];
    if(game && curKey() === k) return { mode: game.mode, prompt: game.prompt, hint: game.hint };
    return null;
  }
  function judge(k, id, a){
    var m = marks && marks[k] && marks[k][id];
    if(typeof m === 'boolean') return m;
    var meta = metaFor(k); if(!meta) return null;
    var ans = meta.mode === 'typing' ? meta.prompt : answers[k];
    if(!ans) return null;
    return meta.mode === 'typing' ? norm(a.text) === norm(ans) : loose(a.text) === loose(ans);
  }

  /* ---------------- 진행자 ---------------- */
  function buildHost(){
    main.innerHTML =
      '<div class="host">' +
        '<section class="card stack" aria-label="문제 만들기">' +
          '<h2 class="big">문제 미리 등록</h2>' +
          '<div class="seg" role="radiogroup" aria-label="문제 종류">' +
            '<input type="radio" name="mode" id="m-quiz" value="quiz" checked><label for="m-quiz">자음 퀴즈</label>' +
            '<input type="radio" name="mode" id="m-typing" value="typing"><label for="m-typing">따라 쓰기</label>' +
          '</div>' +
          '<label class="f" for="in-prompt"><span id="lb-prompt">자음 문제</span><textarea id="in-prompt" placeholder="예: ㅅㄱㅎ ㄱㅈㅂㅇ"></textarea></label>' +
          '<label class="f" for="in-answer" id="wrap-answer"><span>정답 (참가자에게는 보이지 않아요)</span><input type="text" id="in-answer" autocomplete="off" placeholder="예: 소금하고 간장볶음"></label>' +
          '<label class="f" for="in-hint" id="wrap-hint"><span>힌트 (선택)</span><input type="text" id="in-hint" autocomplete="off" placeholder="예: 음식 이름"></label>' +
          '<button type="button" class="btn" id="b-add">목록에 추가</button>' +
          '<div id="qlist"></div>' +
          '<h2 class="big" style="margin-top:6px">진행</h2>' +
          '<div class="btns">' +
            '<button type="button" class="btn primary" id="b-open">문제 공개</button>' +
            '<button type="button" class="btn" id="b-close">마감</button>' +
            '<button type="button" class="btn" id="b-pub">순위 발표</button>' +
          '</div>' +
          '<div class="status" id="hstat"></div>' +
          '<button type="button" class="btn" id="b-reset">기록 초기화 (문제 목록은 유지)</button>' +
          '<label class="chk"><input type="checkbox" id="c-hide" checked> 화면 공유용: 등록한 문제·정답·제출한 답 가리기</label>' +
        '</section>' +
        '<section class="card" aria-label="순위판">' +
          '<div class="boardhead"><h2 id="bh">순위판</h2><label class="f" for="rsel" style="min-width:150px"><span>라운드 보기</span><select id="rsel"></select></label></div>' +
          '<div id="bq"></div>' +
          '<div id="board"></div>' +
        '</section>' +
      '</div>';

    var modeEls = main.querySelectorAll('input[name=mode]');
    function syncMode(){
      var m = main.querySelector('input[name=mode]:checked').value;
      $('#lb-prompt').textContent = m === 'quiz' ? '자음 문제' : '따라 쓸 문장';
      $('#in-prompt').placeholder = m === 'quiz' ? '예: ㅅㄱㅎ ㄱㅈㅂㅇ' : '예: 간장 공장 공장장은 강 공장장이다.';
      $('#wrap-answer').hidden = m !== 'quiz';
      $('#wrap-hint').hidden = m !== 'quiz';
    }
    modeEls.forEach(function(el){ el.addEventListener('change', syncMode); });
    syncMode();

    $('#b-open').addEventListener('click', startRound);
    $('#b-add').addEventListener('click', addQuestion);
    var rt = null, RL = '기록 초기화 (문제 목록은 유지)';
    $('#b-reset').addEventListener('click', function(){
      var b = $('#b-reset');
      if(!rt){ b.textContent = '정말 지울까요? 한 번 더 누르세요'; rt = setTimeout(function(){ rt = null; var x = $('#b-reset'); if(x) x.textContent = RL; }, 4000); return; }
      clearTimeout(rt); rt = null; b.textContent = RL; resetGame();
    });
    $('#qlist').addEventListener('click', function(e){ var b = e.target.closest('[data-q]'); if(b) editQueue(b.dataset.q, +b.dataset.i); });
    $('#b-close').addEventListener('click', function(){ db.doc('game/state').update({ status: 'closed', closedAt: Date.now() }); });
    $('#b-pub').addEventListener('click', publishResults);
    $('#c-hide').addEventListener('change', function(e){ hideOn = e.target.checked; renderBoard(); renderQueue(); });
    $('#rsel').addEventListener('change', function(e){ selRound = e.target.value === 'cur' ? null : e.target.value; renderBoard(); });
    $('#board').addEventListener('click', function(e){
      var b = e.target.closest('[data-mark]'); if(!b) return;
      var k = selRound || curKey(); if(!k) return;
      var cur = marks && marks[k] && marks[k][b.dataset.uid];
      var want = b.dataset.mark === 'true' ? true : b.dataset.mark === 'false' ? false : null;
      var patch = {}; patch[k] = {}; patch[k][b.dataset.uid] = (cur === want) ? null : want;
      upsert(db.doc('game/marks'), patch);
    });
    hostRefresh();
  }

  function startRound(){
    var idx = game && game.round || 0, q = plan[idx];
    if(!q || (game && game.status === 'open')) return;
    var n = idx + 1, k = rk(n);
    var hint = q.mode === 'quiz' ? (q.hint || '') : '';
    var meta = {}; meta[k] = { mode: q.mode, prompt: q.prompt, hint: hint };
    var step = upsert(db.doc('game/rounds'), meta);
    if(q.mode === 'quiz' && q.answer){ var a = {}; a[k] = q.answer; step = step.then(function(){ return upsert(db.doc('secret/answers'), a); }); }
    step.then(function(){
      return db.doc('game/state').set({ round: n, mode: q.mode, prompt: q.prompt, hint: hint, status: 'open', openedAt: Date.now() });
    }).then(function(){ selRound = null; });
  }
  function resetGame(){
    var ops = ['game/state','game/rounds','game/marks','game/results','secret/answers'].map(function(p){ return db.doc(p).delete(); });
    subs.forEach(function(x){ ops.push(db.doc('subs/' + x.id).delete()); });
    Promise.all(ops).then(function(){ selRound = null; });
  }
  function savePlan(items){ return db.doc('secret/plan').set({ items: items }); }
  function addQuestion(){
    var mode = main.querySelector('input[name=mode]:checked').value;
    var prompt = norm($('#in-prompt').value);
    if(!prompt){ $('#in-prompt').focus(); return; }
    var q = { mode: mode, prompt: prompt, answer: mode === 'quiz' ? norm($('#in-answer').value) : '', hint: mode === 'quiz' ? norm($('#in-hint').value) : '' };
    savePlan(plan.concat([q])).then(function(){ $('#in-prompt').value = ''; $('#in-answer').value = ''; $('#in-hint').value = ''; $('#in-prompt').focus(); });
  }
  function editQueue(act, i){
    var locked = game && game.round || 0;
    if(i < locked) return;
    var items = plan.slice(), t;
    if(act === 'del') items.splice(i, 1);
    else if(act === 'up' && i > locked){ t = items[i-1]; items[i-1] = items[i]; items[i] = t; }
    else if(act === 'down' && i < items.length - 1){ t = items[i+1]; items[i+1] = items[i]; items[i] = t; }
    else return;
    savePlan(items);
  }
  function renderQueue(){
    var el = $('#qlist'); if(!el) return;
    if(!plan.length){ el.innerHTML = '<div class="empty" style="padding:14px 4px"><b>등록된 문제가 없어요</b>위에 쓰고 “목록에 추가”를 누르면 순서대로 쌓여요.</div>'; return; }
    var locked = game && game.round || 0, h = '<ol class="ql">';
    plan.forEach(function(q, i){
      var n = i + 1;
      var st = n < locked ? '완료' : n === locked ? (game.status === 'open' ? '진행 중' : '마감') : '대기';
      var cls = n < locked ? 'done' : n === locked ? 'cur' : '';
      var waiting = n > locked;
      var text = (waiting && hideOn) ? '문제 내용 가림' : esc(q.prompt);
      var kind = q.mode === 'typing' ? '따라 쓰기' : '자음 퀴즈' + (q.answer ? (hideOn ? ' · 정답 가림' : ' · 정답: ' + esc(q.answer)) : ' · 정답 없음(직접 채점)');
      h += '<li class="qi ' + cls + '"><div class="qn">' + n + '</div><div class="qt">' + text + '<small>' + kind + ' · ' + st + '</small></div>';
      if(waiting){
        h += '<div class="qc">' +
          (i > locked ? '<button type="button" class="mini" data-q="up" data-i="' + i + '" aria-label="' + n + '번 문제 위로">↑</button>' : '') +
          (i < plan.length - 1 ? '<button type="button" class="mini" data-q="down" data-i="' + i + '" aria-label="' + n + '번 문제 아래로">↓</button>' : '') +
          '<button type="button" class="mini" data-q="del" data-i="' + i + '" aria-label="' + n + '번 문제 삭제">삭제</button></div>';
      }
      h += '</li>';
    });
    el.innerHTML = h + '</ol>';
  }

  function rankedRows(k){
    var rows = subs.filter(function(s){ return s.answers && s.answers[k]; }).map(function(s){
      var a = s.answers[k];
      return { id: s.id, nick: s.nick || '이름 없음', text: a.text, ms: a.ms || 0, tries: a.tries || 1, ok: judge(k, s.id, a) };
    });
    var by = function(a,b){ return a.ms - b.ms; };
    var good = rows.filter(function(r){ return r.ok === true; }).sort(by);
    var pend = rows.filter(function(r){ return r.ok === null; }).sort(by);
    var bad = rows.filter(function(r){ return r.ok === false; }).sort(by);
    return { good: good, all: good.concat(pend, bad), total: rows.length };
  }

  function publishResults(){
    var k = curKey(); if(!k) return;
    var r = rankedRows(k).good.slice(0,3).map(function(x,i){ return { rank: i+1, nick: x.nick, text: x.text, ms: x.ms }; });
    db.doc('game/results').set({ round: game.round, rows: r, at: Date.now() });
  }

  function hostRefresh(){ if(view !== 'host' || !$('#hstat')) return; renderStatus(); renderQueue(); renderSelect(); renderBoard(); }

  function renderStatus(){
    var k = curKey();
    var open = game && game.status === 'open', closed = game && game.status === 'closed';
    var sent = k ? subs.filter(function(s){ return s.answers && s.answers[k]; }).length : 0;
    $('#hstat').innerHTML = k
      ? '<span>' + game.round + '번째 문제</span><span class="pill ' + (open ? 'open' : '') + '">' + (open ? '진행 중' : '마감') + '</span><span>제출 ' + sent + ' / 참가 ' + subs.length + '명</span>'
        + (results && results.round === game.round ? '<span>순위 발표함</span>' : '')
      : '<span>아직 문제를 내지 않았어요. 참가 ' + subs.length + '명</span>';
    var nextI = game && game.round || 0;
    $('#b-open').disabled = !!open || !plan[nextI];
    $('#b-open').textContent = plan[nextI] ? (nextI + 1) + '번 문제 공개' : (nextI ? '모든 문제를 마쳤어요' : '문제를 먼저 등록하세요');
    $('#b-close').disabled = !open;
    $('#b-pub').disabled = !closed;
  }

  function renderSelect(){
    var sel = $('#rsel'), keys = Object.keys(rounds).sort(function(a,b){ return +a.slice(1) - +b.slice(1); });
    var cur = curKey(); if(cur && keys.indexOf(cur) < 0) keys.push(cur);
    var html = '<option value="cur">' + (cur ? '지금 라운드 (' + game.round + ')' : '없음') + '</option>';
    keys.slice().reverse().forEach(function(k){ if(k !== cur) html += '<option value="' + k + '">' + k.slice(1) + '번째 문제</option>'; });
    if(sel.dataset.sig !== html){ sel.innerHTML = html; sel.dataset.sig = html; }
    sel.value = selRound || 'cur';
  }

  function renderBoard(){
    var k = selRound || curKey();
    if(!k){
      $('#bq').innerHTML = '';
      $('#board').innerHTML = '<div class="empty"><b>첫 문제를 기다리고 있어요</b>왼쪽에서 문제를 쓰고 “문제 공개”를 누르면 참가자 화면에 바로 나타나요.</div>';
      return;
    }
    var meta = metaFor(k) || { mode: 'quiz', prompt: '' };
    var isCur = k === curKey(), open = isCur && game.status === 'open';
    $('#bh').textContent = k.slice(1) + '번째 문제 · ' + (meta.mode === 'typing' ? '따라 쓰기' : '자음 퀴즈');
    var ansLine = meta.mode === 'quiz' ? (answers[k] ? (open && hideOn ? '정답은 마감 후에 보여요' : '정답: ' + esc(answers[k])) : '정답을 적어 두지 않았어요. 오른쪽 O / X로 직접 채점하세요.') : '문장과 똑같이 쓴 답만 정답으로 처리돼요.';
    $('#bq').innerHTML = '<div class="chalk" style="margin-top:12px"><span class="k">' + (meta.mode === 'typing' ? '따라 쓰기' : '자음 퀴즈') + '</span><div class="q ' + ((meta.prompt||'').length > 18 ? 'long' : '') + '">' + esc(meta.prompt) + '</div>' + (meta.hint ? '<div class="h">힌트: ' + esc(meta.hint) + '</div>' : '') + '<div class="h">' + ansLine + '</div></div>';
    var r = rankedRows(k);
    if(!r.all.length){
      $('#board').innerHTML = '<div class="empty"><b>아직 제출한 사람이 없어요</b>답이 들어오면 빠른 순서대로 여기에 쌓여요.</div>';
      return;
    }
    var rank = 0, html = '<div class="rows">';
    r.all.forEach(function(x){
      var cls = '', num = '-';
      if(x.ok === true){ rank++; num = rank; if(rank <= 3) cls = 'r' + rank; }
      var hidden = open && hideOn;
      html += '<div class="row ' + cls + '">' +
        '<div class="rk">' + num + '</div>' +
        '<div class="who"><div class="nick">' + esc(x.nick) + '</div><div class="txt">' + (hidden ? '제출했어요 (답 가림)' : esc(x.text)) + '</div></div>' +
        '<div class="tm">' + fmt(x.ms) + '<small>' + (x.tries > 1 ? x.tries + '번째 시도' : '첫 시도') + '</small></div>' +
        '<div class="ctl"><span class="chip ' + (x.ok === true ? 'ok' : x.ok === false ? 'no' : 'na') + '">' + (x.ok === true ? '정답' : x.ok === false ? '오답' : '채점 전') + '</span>' +
        '<button type="button" class="mini" data-mark="true" data-uid="' + esc(x.id) + '" aria-pressed="' + (marks[k] && marks[k][x.id] === true) + '">O</button>' +
        '<button type="button" class="mini" data-mark="false" data-uid="' + esc(x.id) + '" aria-pressed="' + (marks[k] && marks[k][x.id] === false) + '">X</button></div>' +
        '</div>';
    });
    $('#board').innerHTML = html + '</div><p class="note">시간은 각자의 화면에 문제가 뜬 순간부터 답을 보낸 순간까지예요.</p>';
  }

  /* ---------------- 참가자 ---------------- */
  function mySubmission(){ var k = curKey(); return k && mySub && mySub.answers ? mySub.answers[k] : null; }
  function stageSig(){
    var s = mySubmission();
    return [me.joined, canWrite, game && game.round, game && game.status, s ? 'sent' : '', results && results.round].join('|');
  }
  var lastSig = '';
  function buildPlay(){
    main.innerHTML = '<div class="play"><div id="stage"></div></div>';
    lastSig = ''; renderStage(true);
  }
  function renderStage(force){
    if(view !== 'play' || !$('#stage')) return;
    var sig = stageSig(); if(!force && sig === lastSig) return; lastSig = sig;
    var st = $('#stage'), h = '';
    if(!canWrite){
      st.innerHTML = '<div class="card stack"><h2 class="big">답을 저장하지 못했어요</h2><p class="msg bad" style="margin:0">연결에 문제가 있어요. 화면을 새로고침한 뒤 다시 입장해 보세요. 계속되면 진행자에게 알려 주세요.</p></div>'; return;
    }
    if(!me.joined){
      st.innerHTML = '<form class="card stack" id="join"><h2 class="big">닉네임을 정해 주세요</h2><label class="f" for="nick"><span>순위판에 이 이름으로 나와요</span><input type="text" id="nick" maxlength="12" autocomplete="off" value="' + esc(me.nick) + '" placeholder="예: 3학년 2반 김선생"></label><button class="btn primary" type="submit">입장하기</button></form>';
      $('#join').addEventListener('submit', function(e){ e.preventDefault(); var n = norm($('#nick').value); if(!n){ $('#nick').focus(); return; } joinAs(n); });
      return;
    }
    var intro = '<p class="note" style="margin:0">참가자: <b>' + esc(me.nick) + '</b></p>';
    if(!game || !game.round){
      st.innerHTML = '<div class="stack">' + intro + '<div class="card empty"><b>곧 시작해요</b>진행자가 문제를 공개하면 이 화면에 바로 나타나요.</div></div>'; return;
    }
    var sub = mySubmission();
    var typing = game.mode === 'typing';
    var board = '<div class="chalk"><span class="k">' + (typing ? '그대로 따라 쓰세요' : '자음 퀴즈') + ' · ' + game.round + '번째</span><div class="q ' + ((game.prompt||'').length > 18 ? 'long' : '') + '">' + esc(game.prompt) + '</div>' + (game.hint ? '<div class="h">힌트: ' + esc(game.hint) + '</div>' : '') + '</div>';
    if(game.status === 'open' && !sub){
      st.innerHTML = '<div class="stack">' + intro + board +
        '<form class="card stack" id="ans"><label class="f" for="a-in"><span>' + (typing ? '띄어쓰기와 문장부호까지 똑같이 입력하세요' : '정답을 입력하세요') + '</span><input type="text" id="a-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="여기에 입력"></label><div id="fb"></div><button class="btn primary" type="submit">전송</button></form></div>';
      var inp = $('#a-in');
      if(typing){ inp.addEventListener('paste', function(e){ e.preventDefault(); }); inp.addEventListener('drop', function(e){ e.preventDefault(); }); }
      $('#ans').addEventListener('submit', function(e){ e.preventDefault(); submitAnswer(); });
      setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 50);
      return;
    }
    if(sub){
      var closedNote = game.status === 'open' ? '진행자가 마감하면 순위를 발표해요.' : '마감됐어요. 다음 문제를 기다려 주세요.';
      st.innerHTML = '<div class="stack">' + intro + board + '<div class="msg good">전송 완료! ' + fmt(sub.ms || 0) + ' 걸렸어요.</div><div class="card"><div class="note">내가 보낸 답</div><div style="font-size:18px;font-weight:700;overflow-wrap:anywhere">' + esc(sub.text) + '</div></div><p class="note" style="margin:0">' + closedNote + '</p>' + podium() + '</div>';
      return;
    }
    st.innerHTML = '<div class="stack">' + intro + '<div class="card empty"><b>마감됐어요</b>이번 문제는 제출하지 못했어요.</div>' + podium() + '</div>';
  }
  function podium(){
    if(!results || !game || results.round !== game.round || !results.rows || !results.rows.length) return '';
    var h = '<div class="card"><h3 class="big" style="margin-bottom:10px">이번 문제 순위</h3><div class="podium">';
    results.rows.forEach(function(r){
      h += '<div class="row r' + r.rank + '" style="grid-template-columns:46px minmax(0,1fr) auto"><div class="rk">' + r.rank + '</div><div class="who"><div class="nick">' + esc(r.nick) + '</div><div class="txt">' + esc(r.text) + '</div></div><div class="tm">' + fmt(r.ms) + '</div></div>';
    });
    return h + '</div></div>';
  }
  function joinAs(nick){
    me.nick = nick; lsSet('quiz-nick', nick);
    var ref = db.doc('subs/' + uid);
    ref.get().then(function(s){ return s.exists ? ref.update({ nick: nick }) : ref.set({ nick: nick, joinedAt: Date.now(), answers: {} }); })
      .then(function(){ me.joined = true; renderStage(true); })
      .catch(function(){ canWrite = false; renderStage(true); });
  }
  function submitAnswer(){
    var inp = $('#a-in'); var text = norm(inp.value); if(!text){ inp.focus(); return; }
    var ms = Math.max(0, Math.round(performance.now() - shownAt));
    tries++;
    if(game.mode === 'typing' && norm(game.prompt) !== text){
      var a = norm(game.prompt), i = 0; while(i < a.length && i < text.length && a[i] === text[i]) i++;
      $('#fb').innerHTML = '<div class="msg bad" role="alert">' + (i + 1) + '번째 글자부터 달라요. 고쳐서 다시 전송하세요.</div>';
      inp.focus(); return;
    }
    var patch = { nick: me.nick, answers: {} }; patch.answers[curKey()] = { text: text, ms: ms, tries: tries, ts: Date.now() };
    $('#ans button[type=submit]').disabled = true;
    db.doc('subs/' + uid).update(patch).catch(function(){
      $('#fb').innerHTML = '<div class="msg bad" role="alert">전송하지 못했어요. 잠시 후 다시 눌러 주세요.</div>';
      $('#ans button[type=submit]').disabled = false;
    });
  }

  /* ---------------- 연결 ---------------- */
  function switchView(v){
    view = v;
    document.querySelectorAll('#tabs button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === v)); });
    if(v === 'host') buildHost(); else buildPlay();
  }
  function onGame(){
    if(game && game.status === 'open' && shownFor !== game.openedAt){ shownFor = game.openedAt; shownAt = performance.now(); tries = 0; }
    if(view === 'host') hostRefresh(); else renderStage();
  }

  function showErr(title, body){ main.innerHTML = '<div class="card empty"><b>' + esc(title) + '</b>' + esc(body) + '</div>'; }
  function fail(e){ if(window.console) console.error(e); }

  var hostSubscribed = false;
  function enterHost(){
    isHost = true;
    $('#hostlink').hidden = true;
    $('#tabs').hidden = false;
    if(!hostSubscribed){
      hostSubscribed = true;
      db.doc('game/rounds').onSnapshot(function(s){ rounds = s.exists ? s.data() : {}; hostRefresh(); }, fail);
      db.doc('game/marks').onSnapshot(function(s){ marks = s.exists ? s.data() : {}; hostRefresh(); }, fail);
      db.doc('secret/answers').onSnapshot(function(s){ answers = s.exists ? s.data() : {}; hostRefresh(); }, fail);
      db.doc('secret/plan').onSnapshot(function(s){ var d = s.exists ? s.data() : null; plan = d && d.items ? d.items : []; hostRefresh(); }, fail);
      db.collection('subs').onSnapshot(function(q){ subs = q.docs.map(function(d){ var x = d.data() || {}; x.id = d.id; return x; }); hostRefresh(); }, fail);
      $('#tabs').addEventListener('click', function(e){ var b = e.target.closest('button'); if(b) switchView(b.dataset.v); });
    }
    switchView('host');
  }

  function showHostLogin(){
    view = 'login';
    main.innerHTML = '<form class="card stack" id="hl" style="max-width:420px;margin:0 auto"><h2 class="big">진행자 입장</h2>' +
      '<label class="f" for="hpw"><span>진행자 비밀번호</span><input type="password" id="hpw" autocomplete="off"></label>' +
      '<div id="hfb"></div><div class="btns"><button class="btn primary" type="submit">입장</button><button class="btn" type="button" id="hback">돌아가기</button></div></form>';
    $('#hpw').focus();
    $('#hback').addEventListener('click', function(){ view = 'play'; buildPlay(); });
    $('#hl').addEventListener('submit', function(e){
      e.preventDefault();
      var v = $('#hpw').value; if(!v) return;
      db.doc('hosts/' + uid).set({ pw: v }).then(enterHost).catch(function(){
        $('#hfb').innerHTML = '<div class="msg bad" role="alert">비밀번호가 맞지 않아요.</div>';
      });
    });
  }

  function start(){
    $('#hostlink').addEventListener('click', showHostLogin);
    signInAnonymously(auth).then(function(c){
      uid = c.user.uid;
      return db.doc('hosts/' + uid).get().catch(function(){ return { exists: false }; });
    }).then(function(h){
      db.doc('game/state').onSnapshot(function(s){ game = s.exists ? s.data() : null; onGame(); }, fail);
      db.doc('game/results').onSnapshot(function(s){ results = s.exists ? s.data() : null; if(view === 'host') renderStatus(); else renderStage(); }, fail);
      db.doc('subs/' + uid).onSnapshot(function(s){ mySub = s.exists ? s.data() : null; renderStage(); }, fail);
      if(h.exists){ enterHost(); }
      else {
        $('#hostlink').hidden = false;
        view = 'play'; buildPlay();
        if(me.nick) joinAs(me.nick);
      }
    }).catch(function(e){
      var c = e && e.code || '';
      if(c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation') showErr('익명 로그인이 꺼져 있어요', 'Firebase 콘솔 Authentication에서 익명 로그인을 켜 주세요.');
      else showErr('연결하지 못했어요', '인터넷 연결을 확인하고 새로고침해 주세요. 계속되면 진행자에게 알려 주세요.');
      fail(e);
    });
  }
  start();
})();
</script>
</body>
</html>
